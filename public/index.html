<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkboxes</title>

    <style>
      :root {
        --bg: #0b0c0f;
        --surface: rgba(17, 19, 24, 0.75);
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.18);
        --accent: #7c5cff;
        --text: #e6e9ef;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 20%, #623fed22, transparent 40%),
          radial-gradient(circle at 80% 0%, #a147f622, transparent 40%),
          radial-gradient(circle at 50% 100%, #6b21e222, transparent 50%),
          #372732;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin: 32px 0 20px;
      }

      #login {
        margin-bottom: 10px;
      }

      #container {
        width: 100%;
        max-width: 720px;
        padding: 18px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
        gap: 10px;
        background: var(--surface);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      input[type="checkbox"] {
        appearance: none;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 6px;
        border: 1px solid var(--border);
        cursor: pointer;
      }

      input[type="checkbox"]:checked {
        background: linear-gradient(135deg, #7c5cff, #a855f7);
        border-color: #7c5cff;
      }
    </style>
  </head>

  <body>
    <h1>Checkboxes</h1>

    <div id="login">
      <button id="login-btn">Login</button>
    </div>

    <div id="container"></div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      let socket;
      let lastEventTime = 0;
      const gap = 5000;

      const container = document.getElementById("container");
      const button = document.getElementById("login-btn");

      // 🔐 Login redirect
      button.addEventListener("click", () => {
        window.location.href = "/login";
      });

      // 🔌 Connect socket AFTER auth
      function connectSocket() {
        socket = io({
          withCredentials: true,
        });

        socket.on("connect", () => {
          console.log("✅ Connected:", socket.id);
        });

        socket.on("connect_error", (err) => {
          console.log("❌ Auth error:", err.message);
        });

        socket.on("server:checkbox:change", (data) => {
          const { index, checked } = data;
          const input = document.getElementById(`checkbox-${index}`);
          if (input) input.checked = checked;
        });
      }

      // 🚀 On page load
      window.addEventListener("load", async () => {
        try {
          const response = await fetch("/checkboxes");

          if (response.status === 401) {
            console.log("🔒 Not logged in");
            return; // don't connect socket
          }

          const data = await response.json();

          // ✅ Now safe to connect socket
          connectSocket();

          if (data && data.checkboxes) {
            data.checkboxes.forEach((serverValue, index) => {
              const input = document.createElement("input");
              input.type = "checkbox";
              input.id = `checkbox-${index}`;
              input.checked = serverValue;

              input.addEventListener("change", (event) => {
                if (!socket || !socket.connected) {
                  alert("Please login to make changes");
                  event.target.checked = !event.target.checked;
                  return;
                }
                const now = Date.now();

                if (now - lastEventTime < gap) {
                  event.target.checked = !event.target.checked;
                  alert("Wait 5 sec");
                  return;
                }

                lastEventTime = now;

                socket.emit("client:checkbox:change", {
                  index,
                  checked: event.target.checked,
                });
              });

              container.appendChild(input);
            });
          }
        } catch (err) {
          console.error("Error loading checkboxes:", err);
        }
      });
    </script>
  </body>
</html>
