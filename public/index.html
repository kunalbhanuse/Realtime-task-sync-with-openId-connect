<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 million checkboxes</title>
    <style>
      :root {
        --bg: #0b0c0f;
        --surface: rgba(17, 19, 24, 0.75);
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.18);
        --accent: #7c5cff;
        --text: #e6e9ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);

        /* 🔥 Purple gradient background */
        background:
          radial-gradient(circle at 20% 20%, #623fed22, transparent 40%),
          radial-gradient(circle at 80% 0%, #a147f622, transparent 40%),
          radial-gradient(circle at 50% 100%, #6b21e222, transparent 50%),
          #372732;

        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin: 32px 0 20px;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      #container {
        width: 100%;
        max-width: 720px;
        padding: 18px;

        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
        gap: 10px;

        /* glass effect */
        background: var(--surface);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        border: 1px solid var(--border);
        border-radius: 14px;
      }

      input[type="checkbox"] {
        appearance: none;
        width: 100%;
        aspect-ratio: 1 / 1;

        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;

        transition:
          border-color 0.15s ease,
          background-color 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.1s ease;
      }

      input[type="checkbox"]:hover {
        border-color: var(--border-hover);
        transform: scale(1.05);
      }

      input[type="checkbox"]:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px rgba(124, 92, 255, 0.35);
      }

      input[type="checkbox"]:checked {
        background: linear-gradient(135deg, #7c5cff, #a855f7);
        border-color: #7c5cff;
      }

      input[type="checkbox"]:checked::after {
        content: "";
        display: block;
        width: 6px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        margin: auto;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Checkboxes</h1>
    <div id="container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      //   const container = document.getElementById("container");
      //   const CHECKBOX_COUNT = 200;

      //   for (let i = 0; i < CHECKBOX_COUNT; i++) {
      //     const input = document.createElement("input");
      //     input.type = "checkbox";
      //     input.addEventListener("change", (event) => {
      //       const checked = event.target.checked;
      //       console.log("Checked Chenged", { i, checked });
      //       socket.emit("client:checkbox:changed", { i, checked });
      //     });
      //     container.appendChild(input);
      //   }

      const container = document.getElementById("container");
      const CHECKBOX_COUNT = 10;
      socket.on("server:checkbox:change", (data) => {
        console.log("socket server event data : -", data);
        const { index, checked } = data;
        const input = document.getElementById(`checkbox-${index}`);
        if (input) {
          input.checked = checked;
        }
      });

      window.addEventListener("load", async () => {
        const response = await fetch("/checkboxes", { method: "GET" });
        const data = await response.json();
        if (data && data.checkboxes) {
          data.checkboxes.forEach((serverValue, index) => {
            const input = document.createElement("input");
            input.type = "checkbox";
            input.id = `checkbox-${index}`;
            input.checked = serverValue;

            input.addEventListener("change", (event) => {
              const checked = event.target.checked;
              //   console.log({ index, checked });
              socket.emit("client:checkbox:change", { index, checked });
            });
            container.appendChild(input);
          });
        }
      });

      //   new Array(CHECKBOX_COUNT).fill(false).forEach((_, index) => {
      //     const input = document.createElement("input");
      //     input.type = "checkbox";
      //     input.id = `checkbox-${index}`;

      //     input.addEventListener("change", (event) => {
      //       const checked = event.target.checked;
      //       //   console.log({ index, checked });
      //       socket.emit("client:checkbox:change", { index, checked });
      //     });
      //     container.appendChild(input);
      //   });
    </script>
  </body>
</html>
